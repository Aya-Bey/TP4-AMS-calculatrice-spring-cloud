spring.application.name=calcul-service
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

server.forward-headers-strategy=framework
springdoc.cache.disabled=true
# Temporaire (diagnostic) : a retirer ensuite
logging.level.org.apache.coyote.http11=DEBUG
# Temporaire (diagnostic) : a retirer ensuite
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=C:/Users/LEN/tomcat-logs
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%r XFH=%{X-Forwarded-Host}i XFPORT=%{X-Forwarded-Port}i XFPROTO=%{X-Forwarded-Proto}i XFPREFIX=%{X-Forwarded-Prefix}i FWD=%{Forwarded}i